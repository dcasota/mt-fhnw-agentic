[package]
name = "agentic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Monolithic Rust CLI + SQLite repository for agentic thesis work (FHNW MAS)."

[[bin]]
name = "agentic"
path = "src/main.rs"

[dependencies]
agentic-core         = { workspace = true }
agentic-providers    = { workspace = true }
agentic-checks       = { workspace = true }
agentic-import       = { workspace = true }
agentic-export       = { workspace = true }
agentic-figures      = { workspace = true }
zip                  = { version = "2.2", default-features = false, features = ["deflate"] }
walkdir              = { workspace = true }
agentic-tui          = { workspace = true }
agentic-resources    = { workspace = true }
rusqlite             = { workspace = true }

clap                 = { workspace = true }
tokio                = { workspace = true }
anyhow               = { workspace = true }
tracing              = { workspace = true }
tracing-subscriber   = { workspace = true }
serde                = { workspace = true }
serde_json           = { workspace = true }
indicatif            = { workspace = true }
dirs                 = { workspace = true }
chrono               = { workspace = true }

[dev-dependencies]
tempfile = "3.14"

[lints]
workspace = true
