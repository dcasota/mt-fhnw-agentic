[package]
name = "agentic-figures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "figspec JSON -> PNG figure renderer (pure-Rust plotters); the Rust port of render_figspec."

[lib]
name = "agentic_figures"
path = "src/lib.rs"

[dependencies]
plotters   = { workspace = true }
image      = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
anyhow     = { workspace = true }
textwrap   = "0.16"

[dev-dependencies]
# Used by regulation_timeline_panel_a tests to write standalone-render
# PNGs to a scratch dir during the test pass.
tempfile = "3"

[lints]
workspace = true
