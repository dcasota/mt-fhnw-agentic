name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runs-on: windows-latest
            archive: zip
            bin_ext: .exe
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-latest
            archive: tar.gz
            bin_ext: ""
          - target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-latest
            archive: tar.gz
            bin_ext: ""
            cross: true
          - target: x86_64-apple-darwin
            runs-on: macos-13
            archive: tar.gz
            bin_ext: ""
          - target: aarch64-apple-darwin
            runs-on: macos-latest
            archive: tar.gz
            bin_ext: ""
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}

      - name: Install cross (Linux ARM64 only)
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} --bin agentic

      - name: Build (native)
        if: '!matrix.cross'
        run: cargo build --release --target ${{ matrix.target }} --bin agentic

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "agentic-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/agentic${{ matrix.bin_ext }}" $name/
          Copy-Item README.md $name/
          Copy-Item LICENSE $name/
          Compress-Archive -Path $name -DestinationPath "$name.zip"

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          name="agentic-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/agentic${{ matrix.bin_ext }}" "$name/"
          cp README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: agentic-${{ matrix.target }}
          path: |
            *.zip
            *.tar.gz

  release:
    name: publish to GitHub Releases
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd artefacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artefacts/*.zip
            artefacts/*.tar.gz
            artefacts/SHA256SUMS
          generate_release_notes: true
          draft: false

  publish-crate:
    name: publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --token ${{ secrets.CRATES_IO_TOKEN }} -p agentic-core
        continue-on-error: true
      - run: cargo publish --token ${{ secrets.CRATES_IO_TOKEN }} -p agentic-providers
        continue-on-error: true
      - run: cargo publish --token ${{ secrets.CRATES_IO_TOKEN }} -p agentic
        continue-on-error: true
