name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  verify-version:
    name: verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check workspace.package.version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(grep -E '^version\s*=' Cargo.toml | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=$tag ver=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml workspace version ${ver}"
            exit 1
          fi

  build:
    name: build (${{ matrix.target }})
    needs: verify-version
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runs-on: windows-latest
            archive: zip
            bin_ext: .exe
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-latest
            archive: tar.gz
            bin_ext: ""
          - target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-latest
            archive: tar.gz
            bin_ext: ""
            cross: true
          - target: x86_64-apple-darwin
            runs-on: macos-13
            archive: tar.gz
            bin_ext: ""
          - target: aarch64-apple-darwin
            runs-on: macos-latest
            archive: tar.gz
            bin_ext: ""
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}

      - name: Install cross (Linux ARM64 only)
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} --bin agentic

      - name: Build (native)
        if: '!matrix.cross'
        run: cargo build --release --target ${{ matrix.target }} --bin agentic

      - name: Smoke-test binary (host can execute target)
        # Cross-compiled aarch64 Linux can't run on the x86_64 runner.
        # Native targets (incl. M1 macOS, which GitHub's macos-latest is)
        # can all execute the binary they just produced.
        if: '!matrix.cross'
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/agentic${{ matrix.bin_ext }}"
          "$bin" --version
          # doctor --json exits 0 and prints JSON; confirms the binary
          # loads deps and dispatches subcommands correctly.
          "$bin" doctor --json | head -c 400
          echo

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "agentic-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/agentic${{ matrix.bin_ext }}" $name/
          Copy-Item README.md $name/
          Copy-Item LICENSE $name/
          Copy-Item CHANGELOG.md $name/
          Compress-Archive -Path $name -DestinationPath "$name.zip"

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          name="agentic-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/agentic${{ matrix.bin_ext }}" "$name/"
          cp README.md LICENSE CHANGELOG.md "$name/"
          tar czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: agentic-${{ matrix.target }}
          path: |
            *.zip
            *.tar.gz

  release:
    name: publish to GitHub Releases
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artefacts
          merge-multiple: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Install b3sum
        run: cargo install b3sum --locked --version ^1

      - name: Generate checksums (SHA256, SHA512, BLAKE3)
        shell: bash
        run: |
          cd artefacts
          shopt -s nullglob
          archives=(*.zip *.tar.gz)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "::error::no archives found in artefacts/ to hash"
            exit 1
          fi
          echo "Hashing ${#archives[@]} archive(s):"
          printf '  %s\n' "${archives[@]}" | sort
          # Order names deterministically so the manifests are stable across runs.
          IFS=$'\n' archives_sorted=($(sort <<<"${archives[*]}")); unset IFS
          sha256sum "${archives_sorted[@]}" > SHA256SUMS
          sha512sum "${archives_sorted[@]}" > SHA512SUMS
          b3sum     "${archives_sorted[@]}" > B3SUMS
          echo "--- SHA256SUMS ---"; cat SHA256SUMS
          echo "--- SHA512SUMS ---"; cat SHA512SUMS
          echo "--- B3SUMS ---";     cat B3SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artefacts/*.zip
            artefacts/*.tar.gz
            artefacts/SHA256SUMS
            artefacts/SHA512SUMS
            artefacts/B3SUMS
          generate_release_notes: true
          draft: false

  publish-crate:
    # Bottom-up: each tier waits on its dependencies to exist on crates.io.
    # `continue-on-error: true` lets a re-publish (where the version already
    # exists) succeed for the rest of the run; a hard failure on a leaf
    # crate is still surfaced by the binary-release path having already
    # succeeded above.
    name: publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Tier 0 — no internal deps.
      - run: cargo publish --token ${{ secrets.CRATES_IO_TOKEN }} -p agentic-core
        continue-on-error: true
      - run: cargo publish --token ${{ secrets.CRATES_IO_TOKEN }} -p agentic-resources
        continue-on-error: true

      # Tier 1 — depend on core only.
      - run: cargo publish --token ${{ secrets.CRATES_IO_TOKEN }} -p agentic-providers
        continue-on-error: true
      - run: cargo publish --token ${{ secrets.CRATES_IO_TOKEN }} -p agentic-tui
        continue-on-error: true

      # Tier 2 — depend on core + providers.
      - run: cargo publish --token ${{ secrets.CRATES_IO_TOKEN }} -p agentic-checks
        continue-on-error: true
      - run: cargo publish --token ${{ secrets.CRATES_IO_TOKEN }} -p agentic-import
        continue-on-error: true
      - run: cargo publish --token ${{ secrets.CRATES_IO_TOKEN }} -p agentic-export
        continue-on-error: true

      # Tier 3 — top-level binary crate.
      - run: cargo publish --token ${{ secrets.CRATES_IO_TOKEN }} -p agentic
        continue-on-error: true
